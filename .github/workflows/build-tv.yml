name: Build TV APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/src/tv/**'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/build-tv.yml'
  workflow_dispatch:

concurrency:
  group: tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-debug:
    name: Build TV Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Android environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" || true
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble TV Debug
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleTvDebug --stacktrace --no-daemon
      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: pokke-tv-debug
          path: app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
