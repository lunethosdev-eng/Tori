name: Cancel queued builds

on:
  workflow_dispatch:

# Manual: cancela runs en cola del mismo repo (útil si se trabó la cola)
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, status: 'queued', per_page: 100
            });
            let n = 0;
            for (const run of runs) {
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                n++;
                core.info(`Cancelled queued run ${run.id} (${run.name})`);
              } catch (e) {
                core.warning(`Could not cancel ${run.id}: ${e.message}`);
              }
            }
            core.info(`Cancelled ${n} queued runs`);
