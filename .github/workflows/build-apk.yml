name: Build Pokke APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Una sola build de phone a la vez; cancela la anterior si subes otro commit
concurrency:
  group: phone-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Phone Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" || true
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Phone Debug APK
        run: |
          if grep -q 'productFlavors' app/build.gradle.kts 2>/dev/null; then
            ./gradlew assemblePhoneDebug --stacktrace --no-daemon
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokke-phone-debug
          path: |
            app/build/outputs/apk/phone/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
