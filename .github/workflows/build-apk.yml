name: Build Pokke APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          test -f "$SDK_ROOT/platforms/android-37/android.jar"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # productFlavors phone/tv → APK under apk/phone/debug or apk/tv/debug
      - name: Build Phone Debug APK
        run: ./gradlew assemblePhoneDebug --stacktrace --no-daemon

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokke-phone-debug
          path: |
            app/build/outputs/apk/phone/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
